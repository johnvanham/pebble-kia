services:
  proxy:
    build: .
    image: pebble-kia-proxy:dev
    container_name: pebble-kia-proxy
    restart: unless-stopped
    # Handed to the container verbatim. Listing each variable under
    # `environment:` instead would run every value through compose's
    # ${...} interpolation first, which silently eats a '$' in a Kia
    # password — the app then fails to log in with credentials that are
    # demonstrably correct everywhere else.
    env_file:
      - .env
    environment:
      # Only the values that must differ inside the container. These win
      # over env_file, so .env can keep host-side paths.
      - DEMO_DATA_FILE=/app/demo-data.json
      - PROXY_STATE_DB=/app/state/state.db
      - SETUP_QR_DIR=/app/setup
    volumes:
      # Bind-mount the demo JSON so edits on the host are picked up by the
      # next forced refresh without a container rebuild.
      - ./demo-data.json:/app/demo-data.json:ro
      # Kia refresh token + last-known vehicle state. Survives
      # restarts so the watch isn't waiting on a cold fetch.
      - proxy-state:/app/state
      # Setup QR images, on a bind mount so they can be opened and
      # scanned from the host. They encode the bearer token and are
      # written owner-only by the container's user (root), so reading
      # them from the host needs sudo. Nothing serves them over HTTP.
      - ./setup:/app/setup
    ports:
      # Loopback by default: the intended deployment puts Caddy in front
      # and lets it own TLS. Set PROXY_BIND=0.0.0.0 to reach it directly
      # from the LAN — handy for a first run against a phone, but the
      # bearer token then crosses the network in clear text.
      - "${PROXY_BIND:-127.0.0.1}:8000:8000"

volumes:
  proxy-state:
